name: Aplicar patch de interface do Resumo
on:
  push:
    branches:
      - fix/atalho-resumo-linha-zero-20261126
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch pontual e verificar integridade
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "da7e710e65791a2bd201cd79dcdbf941f7444dbc"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          src=p.read_bytes().decode('utf-8')
          old='<button data-tab="parada">PARADA</button>'
          button=old+'<button type="button" id="summary-shortcut" aria-label="Resumo imediato da Folha de Parada" title="Resumo imediato · Linha Zero">Resumo</button>'
          anchor="$('brand').addEventListener('click',e=>{e.preventDefault();openTab('calculator');});"
          js="""
          // Direct access to the existing PARADA summary; never bypass patient confirmation.
          let summaryObserver;
          function openParadaSummary(){
           openTab('parada');
           summaryObserver?.disconnect();
           const frame=$('parada-frame');
           const locate=()=>{
            if(state.active!=='parada')return;
            const doc=frame.contentDocument;
            const summary=doc?.getElementById('resumo-calculado');
            if(!summary)return;
            const reveal=()=>{
             if(state.active!=='parada'){summaryObserver?.disconnect();return true;}
             if(summary.style.display==='none'||!summary.getClientRects().length)return false;
             summary.scrollIntoView({block:'start'});summaryObserver?.disconnect();return true;
            };
            if(reveal())return;
            doc.getElementById('dados-paciente')?.scrollIntoView({block:'start'});
            doc.getElementById('weight-input')?.focus({preventScroll:true});
            summaryObserver=new MutationObserver(reveal);
            summaryObserver.observe(summary,{attributes:true,attributeFilter:['style'],childList:true});
           };
           if(frame.contentDocument?.getElementById('resumo-calculado'))locate();
           else frame.addEventListener('load',locate,{once:true});
          }
          $('summary-shortcut').addEventListener('click',openParadaSummary);
          """
          assert src.count(old)==1 and src.count(anchor)==1
          assert 'id="summary-shortcut"' not in src
          modified=src.replace(old,button).replace(anchor,anchor+'\n'+js)
          assert modified.replace(button,old).replace(anchor+'\n'+js,anchor)==src
          parada=Path('parada.html').read_text()
          assert 'id="resumo-calculado"' in parada
          assert 'quickSec.style.display = "none"' in parada
          p.write_bytes(modified.encode('utf-8'))
          Path('/tmp/summary-shortcut.js').write_text(js)
          PY
          node --check /tmp/summary-shortcut.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-summary-temp.yml
          git add index.html
          git commit -m "Restaura atalho Resumo da Linha Zero na navegação principal"
          git push origin HEAD:fix/atalho-resumo-linha-zero-20261126
